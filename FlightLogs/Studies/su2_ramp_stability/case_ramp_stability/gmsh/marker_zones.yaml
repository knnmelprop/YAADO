# MELprop-IADE | marker zone assignment for cad/ramPcfdSimplified.step | v0.1.0
#
# Filled in from marker_zones.yaml.template using real STEP loop-topology
# measurements (analyses/geometry/results/station_sweep_topology_2026-07-23.csv,
# analyses/geometry/results/station_sweep_transitions_2026-07-23.csv;
# commits 153e0bb, c9be660, docs in docs/geometry/status.md §7).
#
# Marker key names are UNCHANGED from the template (body_wall / interstage_wall /
# booster_wall / base_region / inlet_cap) per cfg/markers.md: "Do not rename
# after meshing -- the .cfg references these strings verbatim."

# --- OBSERVED (00_inventory_step.py run on cad/ramPcfdSimplified.step) -----
# STEP units: millimetres. 2 solids ("Body1", "Body2" in the STEP header).
observed:
  vol_1:
    step_body_name: "Body1"
    bbox_x_mm: [30.1, 1071.5]
    approx_max_radius_mm: 105.33
    # NOT a stage. vol_1's outer max radius (105.33mm) matches vol_2's
    # forward internal bore radius (104.4-108.5mm, see topology sweep) to
    # within measurement noise. vol_1 sits INSIDE vol_2's forward cavity
    # across their whole overlap span x=[159.8, 1071.5]mm. Reads as an
    # inner body/centerbody (near-sharp tip at x=50mm, r_eq~7.6mm --
    # consistent with a nose cone / inlet spike), NOT as "stage 2 / ramjet"
    # in the stage-split sense the template originally implied.
    candidate_identity: "inner centerbody, nested inside vol_2's forward bore (x=159.8-1071.5mm overlap) -- NOT a separate booster/ramjet stage"
  vol_2:
    step_body_name: "Body2"
    bbox_x_mm: [159.8, 4385.1]
    approx_max_radius_mm: 296.5
    # Spans x=159.8-4385.2mm -- 4225mm of the 4355mm vehicle, essentially
    # the whole assembly. Hollow forward (genuine internal bore/duct,
    # n_loops=2 with has_inner_loop=True from x~160 to ~2400mm, closing
    # over x=2400-2500mm), solid barrel x=2500-3600mm, then fins grow from
    # x~3600-3800mm to full span (r=296.5mm) by x=4000mm.
    candidate_identity: "outer airframe: forward duct/shroud + solid barrel + aft fins -- spans nearly the entire vehicle, NOT a single 'stage'"
  # vol_1 and vol_2 overlap in x=[159.8, 1071.5] mm. This overlap is vol_1
  # nesting inside vol_2's forward bore (a centerbody-in-duct arrangement),
  # confirmed by the matching radii above -- NOT a stage-1/stage-2 boundary
  # and NOT an interstage in the traditional multi-stage-rocket sense.
  overlap_x_mm: [159.8, 1071.5]
  global_assembly_x_mm: [30.1, 4385.1]   # nose tip -> aft/base end

# --- CROSS-CHECK vs vehicle_config.yaml (already-reviewed repo data) -------
# global_assembly length = 4385.1 - 30.1 = 4355.0 mm, matches
# Hangar/ramjet_rocket/vehicle_config.yaml stage_2.total_length_m=4.35501 m
# to within 0.01 mm. This confirms the STEP's OVERALL length matches the
# config's already-reviewed total length (whole-vehicle) -- it does NOT
# confirm a solid-to-stage mapping (see candidate_identity above; that
# mapping was checked and found to be a false premise).
cross_check:
  vehicle_config_total_length_m: 4.35501
  step_global_length_mm: 4355.0
  vehicle_config_booster_length_m: 2.089       # stage_1, 47.7% of rocket
  vehicle_config_stage2_diameter_m: 0.200      # body diameter (post drawing update)
  vehicle_config_stage2_nose_diameter_m: 0.150
  vehicle_config_booster_assembly_diameter_m: 0.250   # excl. PRD-240 wings
  vehicle_config_cg_from_nose_m: 1.6084
  # ANOMALY -- flagged, NOT resolved here: the measured barrel section
  # (x=2500-3600mm) is 130.0mm outer diameter (2 x outer_bbox_r=65.00mm,
  # constant to 10 sig figs), while vehicle_config.yaml body.diameter_m is
  # 0.200 (200mm). 70mm discrepancy against a drawing-verified config field.
  # Needs human resolution; no config value touched by this file.

# --- ZONES (confirmed from real geometric transitions, not solid identity) -
# X boundaries in the STEP's own frame (mm), nose = small X. These are
# GEOMETRIC regions (bore/duct, transition, barrel, fin/base) bracketed by
# measured loop-topology changes -- they are deliberately NOT framed as
# stage-1/stage-2 regions, since the solids do not decompose into stages
# (see candidate_identity above).
zones:
  nose_tip_x_mm: 30.1            # OBSERVED (global xmin) -- confirmed nose tip
  interstage_start_x_mm: 2400.0  # bore-closure transition starts (2 loops -> narrowing)
  interstage_end_x_mm: 2500.0    # bore-closure transition complete (1 loop, no inner loop)
  base_end_x_mm: 4385.1          # OBSERVED (global xmax) -- confirmed aft/base end

# Marker name -> [x_min_mm, x_max_mm] in the STEP frame. Names match
# cfg/markers.md verbatim (do not rename after meshing).
#
# inlet_cap        [30.1, 160.0]   nose tip / capped inlet region
# body_wall        [160.0, 2400.0] forward ducted section (hollow bore, n_loops=2,
#                                  has_inner_loop=True until the x=2400-2500mm
#                                  closure; bore r ~108.5mm at x=200 narrowing
#                                  to ~56.5mm at x=2400)
# interstage_wall  [2400.0, 2500.0] bore-closure transition (TRANSITION A: 2
#                                  loops -> 1 loop, i.e. duct closes to solid
#                                  section over this 100mm span)
# booster_wall     [2500.0, 3600.0] uniform solid barrel section -- constant
#                                  cross-section area 12667.686977437404 mm^2
#                                  (identical to 10 sig figs at every sampled
#                                  station x=2500..3600mm), outer_bbox_r=65.00mm
# base_region      [3600.0, 4385.15] fin/aft section -- fins begin growing
#                                  (TRANSITION B: outer_bbox_r 65.00mm at
#                                  x=3600 -> 163.33mm at x=3800 -> 296.53mm
#                                  full span by x=4000) through to the aft/base end
#
# ANOMALY (flagged, NOT resolved): at x=2100mm the sweep found a ring of 14
# separate small faces (each area ~56.5mm^2, r_eq~4.24mm) at bbox radii
# ~62-65mm -- i.e. a ring of 14 small circular members at the duct wall
# radius, inside the body_wall zone above. Reads like a strut/vane/pin ring
# or a perforated station. NOT interpreted further here; needs human/CAD
# review before meshing treats that station as a plain duct wall.
markers:
  body_wall: [160.0, 2400.0]
  interstage_wall: [2400.0, 2500.0]
  booster_wall: [2500.0, 3600.0]
  base_region: [3600.0, 4385.15]
  inlet_cap: [30.1, 160.0]       # auto-detectable candidate: cap-flagged surface at
                                  # global xmin in mesh/inventory/surfaces.csv
