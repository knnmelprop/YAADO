name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install core runtime deps
        run: uv sync

      - name: Run fast + cfd_smoke tiers
        run: uv run pytest -q
