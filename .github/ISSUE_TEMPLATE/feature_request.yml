name: Feature Request
description: Request a new feature for the framework
title: "[FEATURE] "
labels: ["feature-request"]
body:
  - type: dropdown
    id: framework-part
    attributes:
      label: Which part of the framework is this related to?
      description: Select the core directory this issue affects.
      options:
        - 🧩 ComponentStore
        - ⚙️ Foundation
        - 🧠 FlightDeck
        - ✈️ modules/airframe
        - 🚀 modules/flight_dynamics
        - 🔥 modules/powerplant
        - 📐 modules/stability_control
        - 💨 modules/wind_tunnel
        - 📂 Hangar / User Workspace
        - ❓ Other
    validations:
      required: true
  - type: input
    id: where-other
    attributes:
      label: 'If "Other", please specify:'
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the new feature
      description: What should it do and why is it needed?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Please provide your sources (papers, books, links)
