name: Bug report
description: Something in the code/analysis pipeline is broken or gives a wrong result
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: whats-broken
    attributes:
      label: What's broken
      description: A clear description of the incorrect behavior.
    validations:
      required: true
  - type: dropdown
    id: framework-part
    attributes:
      label: Which part of the framework is this related to?
      description: Select the core directory this issue affects.
      options:
        - 🧩 ComponentStore
        - ⚙️ Foundation
        - 🧠 FlightDeck
        - ✈️ modules/airframe
        - 🚀 modules/flight_dynamics
        - 🔥 modules/powerplant
        - 📐 modules/stability_control
        - 💨 modules/wind_tunnel
        - 📂 Hangar / User Workspace
        - ❓ Other
    validations:
      required: true
  - type: input
    id: where-other
    attributes:
      label: If "Other" (or for a specific script), please specify:
      description: Provide the specific path or description (e.g., YAADO_Core/modules/...)
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we replicate the issue?
      value: |
        ```bash
        uv run pytest YAADO_Core/tests/unit/test_XXX.py -v
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What you expected, what actually happened (paste the error/output).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., Ubuntu 22.04, Windows 11, macOS
    validations:
      required: true
