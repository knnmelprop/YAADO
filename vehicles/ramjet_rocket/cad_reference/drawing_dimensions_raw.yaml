# MELprop-IADE | vehicles.ramjet_rocket.cad_reference.drawing_dimensions_raw | v0.1.0
#
# RAW EXTRACTED FROM DRAWING, not yet integrated into main schema — needs
# schema design session. This is a staging area, not a validated config —
# nothing here is read by any analysis script or Pydantic schema yet.
#
# Source: "CFD Simplified Single Rocket Model" (Aleks Czernicki, DWG
# 10/07/2026, sheet 1/1), read directly from the attached PDF this session.
# Values already integrated into vehicle_config.yaml (nozzle throat/exit
# diameter, body diameter, total length, fin sweep, fin span) are NOT
# repeated here — see vehicle_config.yaml directly for those.

inlet_cone:
  external_half_angle_deg: 42.0
  internal_half_angle_deg: 60.0
  centerbody_dims_mm: [85, 62]   # as dimensioned on drawing; axis unclear (length x diameter?)

nozzle_stations_m:
  convergence_start: 1.000
  throat: 1.250
  exit: 1.4807

notes: >
  Confidence: HIGH for the numeric values themselves (directly read off
  labeled dimension lines on the drawing), but the physical
  interpretation/schema mapping is NOT yet decided — e.g. whether
  centerbody_dims_mm is [length, diameter] or [diameter, length], how
  nozzle_stations_m relate to the existing body.total_length_m /
  nose_length_m station convention, and whether inlet_cone here
  describes the same physical feature as the existing
  cfd_notes.ramjet_inlet_note "axisymmetric conical spike" (cone
  L=0.293m base 0.150m) or a distinct part of the intake. A deliberate
  schema design pass (new Pydantic model, e.g. InletGeometry /
  NozzleStations) is needed before this data drives any analysis.
