# MELprop-IADE | vehicles.ramjet_rocket | v0.2.0
# Geometry reconciled with Fusion 360 Assembly v6 extraction (CORRECTED, cm->m,
# Y-axis longitudinal). Full raw extraction: fusion_extraction_v6.yaml (companion).
name: "MELprop-Ramjet-Missile"
vehicle_type: "Rocket"
description: "Dwustopniowa rakieta: solid booster + ramjet cruise (Fusion Assembly v6)"
stage_1:
  type: "solid_rocket"
  geometry:
    assembly_diameter_m: 0.250        # aero reference = body diameter
    assembly_diameter_body_m: 0.250
    assembly_diameter_bbox_m: 1.809   # booster bbox incl. PRD-240 wings
    wings_halfspan_est_m: 0.780       # (1.809 - 0.250) / 2
    booster_length_m: 2.089           # booster assembly (47.7% of rocket)
  propulsion:
    isp_vacuum_s: 230                 # SZACOWANY
    isp_sl_s: 207                     # SZACOWANY
    thrust_peak_N: 29000              # SZACOWANY — was 12000 (physically impossible: below mean); see note
    thrust_mean_N: 25375              # SZACOWANY — impulse-consistent (Isp_sl * mdot * g0)
    burn_time_s: 6.0                  # SZACOWANY
    propellant_mass_kg: 75.0          # SZACOWANY
    propellant_density_kg_m3: 1750    # SZACOWANY
    note: "HTPB/AP composite estimate; R-13 motor is a Fusion mockup — replace with datasheet. thrust_peak_N corrected 2026-07-08: previous value (12000 N) was below the impulse-consistent mean (~25.4 kN), which is physically impossible; schema now rejects peak<mean at load time."
stage_2:
  type: "ramjet"
  design_mach: 2.5         # TBD — decyzja projektowa
  fuel_type: "kerosene"
  combustor_temp_K: 2000.0
  # Nozzle throat/exit diameters + area ratio from "CFD Simplified Single
  # Rocket Model" (Aleks Czernicki, DWG 10/07/2026, sheet 1/1) — replaces
  # the 4.0 design-intent placeholder with a real dimensioned value.
  # Resolves HR-3 (Laval vs cylindrical) with a real, non-cylindrical,
  # non-4.0 nozzle: area_ratio = (241/210)^2 = 1.317.
  nozzle_area_ratio: 1.317
  nozzle_throat_diameter_m: 0.210
  nozzle_exit_diameter_m: 0.241
body:
  length_m: 4.084          # cylindrical portion = total 4.377 - nose 0.293
  diameter_m: 0.250        # Fusion-verified body diameter
  nose_type: "conical"
  nose_length_m: 0.293
  nose_diameter_m: 0.150
  total_length_m: 4.377    # TOTAL rocket length (Fusion, Y-axis)
  max_diameter_m: 0.639    # max transverse dimension (Fusion bbox)
fins:
  count: 4
  span_m: 0.6685           # exposed span of one fin (Fusion)
  sweep_deg: 0.0           # rectangular planform, LE & TE sweep 0
  chord_root_m: 0.1768
  chord_tip_m: 0.1768
mass_properties:
  cg_from_nose_m: 1.6084   # Fusion (cm-bug fixed, Y-axis longitudinal); 36.7% L
  cg_source: "Fusion 360 Assembly v6, verified by component breakdown"
  total_mass_kg: 355.02    # Fusion physics engine (booster 277.8 + ramjet 15.18 + other)
cfd_notes:
  booster_diameter_note: "Body diameter 0.250m; bbox 1.809m includes PRD-240 fins"
  ramjet_inlet_note: "Axisymmetric conical spike: cone L=0.293m base 0.150m; capture area 0.0491 m^2; diffuser expansion 2.98"
  length_reconciliation: "Fusion total 4.377m; nose 0.293m is included in total (do not add to body). Task-2 spec listing body cylinder=4.377m double-counts the nose; analyses use total=4.377m, cylinder=4.084m."
  cfd_simplified_model_note_2026_07_10: >
    "CFD Simplified Single Rocket Model" drawing (Aleks Czernicki, DWG
    10/07/2026, sheet 1/1) supplies: nozzle throat/exit diameters (used
    above), inlet cone 42deg external / 60deg internal with centerbody
    85x62mm (NOT yet represented as structured schema fields -- no inlet
    -geometry schema section exists yet; this note preserves the raw
    values pending a deliberate schema design pass), nozzle convergence/
    diverging stations, total length 4355.01mm, station markers at
    1480.7mm (nozzle exit) and 1738.2mm (ramjet section end), and a fin
    sweep of 29.98deg with tail dims 550mm/127mm not yet confidently
    mapped to fin span vs another dimension. The drawing's body diameter
    (Ø200mm throughout) and total length (4355.01mm) and fin sweep
    (29.98deg, i.e. NOT rectangular) conflict with this file's existing
    Fusion-verified body.diameter_m=0.250, body.total_length_m=4.377,
    and fins.sweep_deg=0.0 -- NOT reconciled here, flagged for human
    decision (does this "simplified" CFD model supersede the detailed
    Fusion export, or is it a deliberately-simplified meshing geometry
    that should not overwrite flight-vehicle dimensions?).
