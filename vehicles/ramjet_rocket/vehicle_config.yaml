  - "stage_2 ramjet design_mach final decision"
  - "moments of inertia Ixx/Iyy/Izz — open Fusion 360 Assembly v6, right-click main component → 'Physical Properties', copy Ixx/Iyy/Izz tensor (units: kg*m^2) from GUI panel. Not scriptable via Fusion API."
  - "RECONCILE: CFD-simplified-model body diameter (0.200m) vs Fusion-verified (0.250m); total length 4355.01mm vs 4.377m; fin sweep 29.98deg (swept) vs Fusion 0.0deg (rectangular) — see cfd_simplified_model_note_2026_07_10. NOT applied to body:/fins: sections pending human decision."
