# MELprop-IADE | pytest configuration
[pytest]
# Scope collection to tests/ so repo-root collection does not crash on the
# external/su2 meson fixtures (long-standing gotcha, see agents/memory.md).
testpaths = tests
# Default run = everything EXCEPT the heavy production tier. Unmarked tests
# (the existing ~240) have no marker, so `not cfd_nightly` selects them.
addopts = -m "not cfd_nightly"
markers =
    fast: quick unit tests, always run (default tier).
    cfd_smoke: coarse/stub CFD-pipeline tests using fake SU2_CFD stubs and
        synthetic toy meshes (no real solver/mesh); run on every push in CI.
    cfd_nightly: full production CFD tier (real solver, real mesh); manual /
        nightly dispatch ONLY, never run in the fast suite or on push.
