[project]
name = "YAADO"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "scipy",
    "matplotlib",
    "om-pycycle==4.1.2",
    "pytest",
    "gmsh==4.15.1",
    "toml>=0.10.2",
    "ambiance>=1.3.1",
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
